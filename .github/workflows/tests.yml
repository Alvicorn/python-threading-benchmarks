name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install Python (from .python-version)
        run: uv python install

      - name: Sync dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest tests/ -v
