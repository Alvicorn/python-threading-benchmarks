name: tests

on:
  push:
    branches: [main, benchmarks]
  pull_request:
    branches: [main, benchmarks]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Canonical interpreter the suite is designed to characterise.
      # Contributors can run on any CPython 3.13+ per pyproject.toml;
      # CI always exercises the free-threaded 3.14 build.
      UV_PYTHON: "3.14+freethreaded"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install canonical Python
        run: uv python install 3.14+freethreaded

      - name: Sync dependencies
        run: uv sync

      - name: Lint
        run: uv run pre-commit run --all-files

      - name: Run tests
        run: uv run pytest tests/ -v
